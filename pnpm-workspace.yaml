packages:
  - "apps/*"
  - "packages/*"

# Estos paquetes necesitan ejecutar scripts de instalación:
# Prisma descarga sus motores nativos y esbuild su binario. Sin esto, ni el
# cliente de Prisma ni los tests arrancan.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
